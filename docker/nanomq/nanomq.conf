mqtt {
    property_size = 32
    max_topic_alias = 1024
    max_packet_size = 256MB
    max_mqueue_len = 2048
    retry_interval = 10s
    keepalive_multiplier = 1.25
}

listeners.tcp {
    bind = "0.0.0.0:1883"
}

log {
    to = [console]
    level = warn
}

auth {
    allow_anonymous = false
    no_match = allow
    deny_action = disconnect
    password = {include "/etc/nanomq_pwd.conf"}
}
