# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # Jar 运行取 Jar 所在目录的上一级安装目录；IDE/debug 运行取 user.dir；可通过 -Dapp.home 显式覆盖
  profile: ${app.home:${user.dir}}/upload
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
  # 文件上传路径
  xnljmap:
    # 本地文件映射
    oss: file:${app.home:${user.dir}}/upload
  # 图片格式
  defaultFormat: .png

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 2GB
      # 设置总上传的文件大小
      max-request-size: 2GB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  cache:
    type: redis   # 强制使用 Redis 作为 Spring Cache 的实现
    redis:
      time-to-live: 600000   # 默认缓存 TTL（毫秒，10 分钟）
      use-key-prefix: true   # 是否使用前缀
      cache-null-values: false  # 是否缓存空值（false 避免缓存击穿）
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
#      host: 192.168.1.216
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
#      password:
      password: 123456
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 3000

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'iot'
      display-name: 'iot'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.iot.controller


# 防盗链配置 
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

mqtt:
  enabled: false
  host: 192.168.1.168
  port: 1883
  client-id: iot-platform-server
  username: admin
  password: public
  qos: 0
  topic-pattern: /+/+/properties/report

# 是否启用插件配置
plugin:
  enabled: true
  # dev=按 jar 加载插件（需把 *-all.jar 放到插件根目录）；prod=按展开目录加载（源码/IDE 调试，读各模块 target/classes）
  mode: dev

# InfluxDB时序数据库配置
influxdb:
  # 是否启用InfluxDB
  enabled: true
  # InfluxDB 2.x 默认 HTTP 地址
  url: http://localhost:8086
  # InfluxDB 2 访问令牌（请替换为实际 token）
  token: "oNuGaPRAlU70g9YuBOhS5ZqQopD-j12j_WkM5QTGFZWi0cBAaUGsnYInNClkTCzoroFtGwd4oeYi5SPAxmD9Jw=="
  org: "lightning"
  # InfluxDB 2 bucket
  bucket: device_history
  write-timeout: 10000
  query-timeout: 10000

# 设备历史数据存储配置
device:
  history:
    storage:
      # 存储策略：mysql 或 influxdb，默认使用mysql
      strategy: influxdb

# 系统备份配置（所有目录均相对于安装目录）
system:
  backup:
    backup-directory: backup
    temp-directory: backup/temp
    mysql:
      # Windows 运行时自动补充 .exe，Linux 保持无扩展名
      mysqldump: mysql/bin/mysqldump
      mysql: mysql/bin/mysql
      host: 127.0.0.1
      port: 3306
      username: root
      password: ${MYSQL_PASSWORD:${spring.datasource.druid.master.password:}}
      database: lightning
    upload:
      directory: upload
